<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0e12">
<title>Jenom Ondra 🔥</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root { --grad:linear-gradient(135deg,#ff3d7f,#ff7a59); --bg:#0e0e12; --panel:#1a1a21; --like:#2fe0a2; --nope:#ff4d6d; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:var(--bg); color:#fff; font-family:'Plus Jakarta Sans',system-ui,sans-serif; overflow:hidden; }
  button { font:inherit; color:inherit; cursor:pointer; border:none; background:none; }
  .hidden { display:none !important; }
  .screen { position:fixed; inset:0; display:flex; justify-content:center; align-items:center; padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom)); }
  .wrap { width:100%; max-width:420px; height:100%; max-height:860px; display:flex; flex-direction:column; }
  .btn { width:100%; padding:16px; border-radius:99px; font-weight:800; font-size:16px; background:var(--grad); box-shadow:0 10px 24px rgba(255,61,127,.3); }
  .btn:active { transform:scale(.97); }

  /* login */
  #gate { background:radial-gradient(circle at 20% 15%,#ff3d7f 0,transparent 50%),radial-gradient(circle at 85% 85%,#ff9a3d 0,transparent 50%),#ff5a6e; }
  .box { width:min(360px,100%); text-align:center; padding:40px 26px 30px; border-radius:30px; background:rgba(255,255,255,.15); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.3); box-shadow:0 30px 60px rgba(120,0,40,.3); }
  .box .flame { font-size:54px; }
  .box h1 { font-size:32px; font-weight:800; margin-top:6px; }
  .box p { margin:8px 0 24px; opacity:.92; }
  #pw { width:100%; font:inherit; font-size:20px; text-align:center; padding:15px; border-radius:16px; border:none; outline:none; color:#222; }
  #loginBtn { margin-top:12px; background:#1a1a22; box-shadow:none; border-radius:16px; }
  #err { min-height:20px; margin-top:12px; font-weight:600; font-size:14px; }

  header { display:flex; align-items:center; justify-content:space-between; padding:4px 2px 12px; }
  .brand { font-weight:800; font-size:23px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .who { font-size:13px; opacity:.6; }

  /* swipe */
  #deck { position:relative; flex:1; min-height:0; }
  .card { position:absolute; inset:0; border-radius:24px; overflow:hidden; background:linear-gradient(160deg,#3a2030,#1b1b26 60%) center/cover; touch-action:none; user-select:none; box-shadow:0 16px 36px rgba(0,0,0,.5); display:grid; place-items:center; font-size:120px; }
  .card .shade { position:absolute; inset:0; background:linear-gradient(transparent 50%,rgba(0,0,0,.9)); }
  .card .info { position:absolute; left:20px; right:20px; bottom:20px; font-size:15px; }
  .card h2 { font-size:30px; font-weight:800; }
  .stamp { position:absolute; top:50px; font-size:38px; font-weight:800; padding:4px 12px; border:5px solid; border-radius:12px; opacity:0; }
  .stamp.l { left:20px; color:var(--like); transform:rotate(-16deg); } .stamp.n { right:20px; color:var(--nope); transform:rotate(16deg); }
  .controls { display:flex; justify-content:center; gap:28px; padding:16px 0 4px; }
  .cb { width:66px; height:66px; border-radius:50%; background:var(--panel); font-size:28px; box-shadow:0 8px 20px rgba(0,0,0,.45); }
  .cb:active { transform:scale(.88); }

  /* info screens */
  .center { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:14px; padding:0 10px; }
  .center .e { font-size:80px; animation:beat 1.4s infinite; } @keyframes beat { 50% { transform:scale(1.1); } }
  .center h2 { font-size:30px; font-weight:800; }
  .center p { opacity:.8; line-height:1.45; max-width:320px; }
  .overlay { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:24px; text-align:center; background:rgba(10,10,14,.85); backdrop-filter:blur(12px); }
  .overlay h2 { font-size:28px; font-weight:800; margin:8px 0; } .overlay p { opacity:.85; margin-bottom:24px; }

  /* chat */
  #msgs { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:8px 2px; }
  .m { max-width:78%; padding:10px 14px; border-radius:20px; line-height:1.35; word-wrap:break-word; font-size:15px; }
  .m.me { align-self:flex-end; background:var(--grad); border-bottom-right-radius:6px; }
  .m.them { align-self:flex-start; background:var(--panel); border-bottom-left-radius:6px; }
  .m img { display:block; max-width:100%; max-height:320px; border-radius:14px; }
  .m.media { padding:4px; background:none; }
  .m audio { width:230px; max-width:100%; display:block; }
  .t { font-size:10.5px; opacity:.55; margin-top:3px; }
  .bar { display:flex; align-items:center; gap:8px; padding-top:8px; }
  #txt { flex:1; min-width:0; font:inherit; font-size:16px; padding:13px 16px; border-radius:99px; border:1px solid rgba(255,255,255,.1); background:var(--panel); color:#fff; outline:none; }
  .ib { width:46px; height:46px; flex:none; border-radius:50%; background:var(--panel); font-size:20px; display:grid; place-items:center; }
  #send { background:var(--grad); }
  #mic.rec { background:var(--nope); animation:beat 1s infinite; }
  .empty { margin:auto; opacity:.5; text-align:center; font-size:14px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="gate" class="screen">
  <div class="box">
    <div class="flame">🔥</div>
    <h1>jenom Ondra</h1>
    <p>Seznamka s jediným profilem. Tím nejlepším.</p>
    <input id="pw" type="password" placeholder="heslo" autocomplete="current-password">
    <button id="loginBtn" class="btn">Vstoupit 💘</button>
    <div id="err"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="screen hidden">
  <div class="wrap">
    <header><div class="brand">🔥 jenom ondra</div><button class="who" id="logout">odhlásit</button></header>

    <!-- ona: swipe -->
    <div id="vSwipe" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div id="deck"></div>
      <div class="controls"><button class="cb" onclick="swipe(-1)">❌</button><button class="cb" onclick="swipe(1)">💚</button></div>
    </div>

    <!-- čekání / potvrzení -->
    <div id="vInfo" class="center hidden"></div>

    <!-- chat -->
    <div id="vChat" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div id="msgs"></div>
      <div class="bar">
        <button class="ib" id="photoBtn" title="Fotka">📷</button>
        <input id="file" type="file" accept="image/*" class="hidden">
        <input id="txt" placeholder="Napiš zprávu…" autocomplete="off">
        <button class="ib" id="mic" title="Hlasovka">🎤</button>
        <button class="ib" id="send" title="Poslat">➤</button>
      </div>
    </div>
  </div>
</div>

<div id="nope" class="overlay hidden"><div><div style="font-size:70px">🥺</div><h2 id="nopeT"></h2><p id="nopeP"></p><button class="btn" onclick="$('nope').classList.add('hidden')">Dobře, promiň</button></div></div>

<script>
/* ===== NASTAVENÍ ===== */
const SUPABASE_URL = "https://zucrciirlivoykxfbxcx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1Y3JjaWlybGl2b3lreGZieGN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMjkyMDMsImV4cCI6MjExMDYwNTIwM30.BhFLmTB2MAEnhniDSgUgQZioIFkVzsXI-gk1OZQJA_s";
const ACCOUNTS = {               // heslo (bez ohledu na velikost písmen) -> účet
  "tiger":     { email:"ona@jenomondra.app", role:"ona" },
  "cukrkanda": { email:"on@jenomondra.app",  role:"on"  },
};
const PW_SUFFIX = "-jo2026";     // Supabase chce min. 6 znaků
const PHOTOS = Array.from({length:10}, (_, i) => `fotky/${i+1}.jpg`);   // Ondrovy fotky na kartách
const BIOS = [
  "Nesu chipsy. Jsou pro nás oba. Asi. 🍿",
  "Zkoušel jsem kalhoty. Sluší mi? Rozhodni ty. 👖",
  "Jazyk ven = jsem připravený na rande. 😛",
  "Zahraju ti serenádu. Na kytaru i pod oknem. 🎸",
  "Romantik. Růži mám vždycky po ruce. Nebo v puse. 🌹",
  "Volám ti. Zase. Zvedni to. 📞",
  "Po tréninku. Palec nahoru, jestli taky. 👍",
  "Usměvavý, hodný, k mání. Teda jen pro tebe.",
  "Ráno bez kafe. Prosím buď na mě hodná.",
  "Tajemný kluk v černém. Hledá svou holku.",
];
const NOPES = [["Tos asi nechtěla 🤨","Palec ti sklouzl, že jo?"],["Chyba systému ⚠️","Swipe doleva tu není podporovaný."],["Opravdu?! 😢","Ondra teď smutně kouká do zdi."]];
/* ===================== */

const $ = id => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null, role = null, state = null, idx = 0, nopes = 0, chatSub = null;

/* ---------- login ---------- */
$("pw").addEventListener("keydown", e => e.key === "Enter" && login());
$("loginBtn").onclick = login;
$("logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function login() {
  const pw = $("pw").value.trim().toLowerCase(), acc = ACCOUNTS[pw];
  if (!acc) return $("err").textContent = "Špatné heslo 😌";
  $("err").textContent = "Přihlašuju…";
  const { error } = await sb.auth.signInWithPassword({ email: acc.email, password: pw + PW_SUFFIX });
  if (error) return $("err").textContent = "Nepovedlo se: " + error.message;
  start();
}
async function start() {
  const { data } = await sb.auth.getUser(); if (!data.user) return;
  me = data.user; role = me.email.startsWith("ona") ? "ona" : "on";
  $("gate").classList.add("hidden"); $("app").classList.remove("hidden");
  await loadState();
  sb.channel("st").on("postgres_changes", { event:"*", schema:"public", table:"state" }, p => { state = p.new; route(); }).subscribe();
}
sb.auth.getSession().then(({ data }) => data.session && start());

/* ---------- stav matche ---------- */
async function loadState() { const { data } = await sb.from("state").select().eq("id",1).single(); state = data; route(); }
async function setState(patch) { const { data } = await sb.from("state").update(patch).eq("id",1).select().single(); state = data; route(); }

function show(v) { ["vSwipe","vInfo","vChat"].forEach(x => $(x).classList.toggle("hidden", x !== v)); }
function info(html) { $("vInfo").innerHTML = html; show("vInfo"); }

function route() {
  if (state.she_liked && state.he_confirmed) return openChat();
  if (role === "ona") {
    if (!state.she_liked) { show("vSwipe"); renderCard(); }
    else info(`<div class="e">⏳</div><h2>Lajk odeslán!</h2><p>Teď se čeká, až Ondra potvrdí match. Neboj, dlouho to trvat nebude 😏</p>`);
  } else {
    if (!state.she_liked) info(`<div class="e">👀</div><h2>Zatím nic</h2><p>Ještě tě nelajkla. Čekej trpělivě, krasavče.</p>`);
    else info(`<div class="e">💘</div><h2>Lajkla tě!</h2><p>Chceš potvrdit match a otevřít chat?</p><button class="btn" style="max-width:300px" onclick="setState({he_confirmed:true})">Potvrdit match 💚</button>`);
  }
}

/* ---------- swipe (jen ona) ---------- */
function renderCard() {
  const deck = $("deck"); deck.innerHTML = "";
  const c = document.createElement("div"); c.className = "card";
  const src = PHOTOS[idx % PHOTOS.length];
  c.innerHTML = `<span class="ph">😎</span><div class="shade"></div><div class="stamp l">ANO</div><div class="stamp n">NE</div>
    <div class="info"><h2>Ondra</h2><div>📍 0.1 km od tebe · online</div><div style="margin-top:6px">${BIOS[idx % BIOS.length]}</div></div>`;
  const im = new Image(); im.onload = () => { c.style.backgroundImage = `url('${src}')`; c.querySelector(".ph").remove(); }; im.src = src;
  deck.appendChild(c); drag(c);
}
function drag(c) {
  let sx = 0, dx = 0, on = false;
  c.onpointerdown = e => { on = true; sx = e.clientX; c.setPointerCapture(e.pointerId); c.style.transition = "none"; };
  c.onpointermove = e => { if (!on) return; dx = e.clientX - sx; c.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
    c.querySelector(".l").style.opacity = Math.max(0, dx/90); c.querySelector(".n").style.opacity = Math.max(0, -dx/90); };
  c.onpointerup = c.onpointercancel = () => { if (!on) return; on = false;
    if (Math.abs(dx) > 100) swipe(Math.sign(dx)); else { c.style.transition = "transform .3s"; c.style.transform = ""; c.querySelectorAll(".stamp").forEach(s => s.style.opacity = 0); } dx = 0; };
}
function swipe(dir) {
  const c = $("deck").firstElementChild; if (!c) return;
  c.style.transition = "transform .4s"; c.style.transform = `translateX(${dir * innerWidth * 1.3}px) rotate(${dir*28}deg)`;
  setTimeout(() => {
    if (dir > 0) setState({ she_liked:true });
    else { idx++; renderCard(); const [t,p] = NOPES[nopes++ % NOPES.length]; $("nopeT").textContent = t; $("nopeP").textContent = p; $("nope").classList.remove("hidden"); }
  }, 350);
}

/* ---------- chat ---------- */
async function openChat() {
  show("vChat"); if (chatSub) return;
  const { data } = await sb.from("messages").select().order("created_at").limit(500);
  $("msgs").innerHTML = data.length ? "" : `<div class="empty" id="empty">💚 Je to match!<br>Napište si první zprávu.</div>`;
  for (const m of data) await addMsg(m);
  scrollDown();
  chatSub = sb.channel("msgs").on("postgres_changes", { event:"INSERT", schema:"public", table:"messages" }, async p => { await addMsg(p.new); scrollDown(); }).subscribe();
}
const seen = new Set();
async function addMsg(m) {
  if (seen.has(m.id)) return; seen.add(m.id); $("empty")?.remove();
  const d = document.createElement("div"); d.className = "m " + (m.sender === me.id ? "me" : "them");
  const time = new Date(m.created_at).toLocaleTimeString("cs", { hour:"2-digit", minute:"2-digit" });
  if (m.kind === "text") { d.textContent = m.body; }
  else {
    d.classList.add("media");
    const { data } = await sb.storage.from("chat").createSignedUrl(m.path, 60 * 60 * 24 * 7);
    const el = m.kind === "image" ? Object.assign(new Image(), { src:data?.signedUrl, onload:scrollDown }) : Object.assign(document.createElement("audio"), { src:data?.signedUrl, controls:true });
    if (m.kind === "image") el.onclick = () => window.open(el.src);
    d.appendChild(el);
  }
  const t = document.createElement("div"); t.className = "t"; t.textContent = time; d.appendChild(t);
  $("msgs").appendChild(d);
}
function scrollDown() { const b = $("msgs"); b.scrollTop = b.scrollHeight; }

async function sendText() {
  const body = $("txt").value.trim(); if (!body) return; $("txt").value = "";
  const { data, error } = await sb.from("messages").insert({ kind:"text", body }).select().single();
  if (error) return alert(error.message); await addMsg(data); scrollDown();
}
async function sendFile(blob, kind, ext) {
  const path = `${crypto.randomUUID()}.${ext}`;
  const up = await sb.storage.from("chat").upload(path, blob, { contentType: blob.type });
  if (up.error) return alert(up.error.message);
  const { data, error } = await sb.from("messages").insert({ kind, path }).select().single();
  if (error) return alert(error.message); await addMsg(data); scrollDown();
}
$("send").onclick = sendText;
$("txt").addEventListener("keydown", e => e.key === "Enter" && sendText());
$("photoBtn").onclick = () => $("file").click();
$("file").onchange = e => { const f = e.target.files[0]; if (f) sendFile(f, "image", (f.name.split(".").pop() || "jpg").toLowerCase()); e.target.value = ""; };

let rec = null, chunks = [];
$("mic").onclick = async () => {
  if (rec) { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const type = ["audio/webm","audio/mp4","audio/ogg"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(stream, type ? { mimeType:type } : {}); chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); $("mic").classList.remove("rec"); $("mic").textContent = "🎤";
      const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" }); rec = null;
      if (blob.size > 0) sendFile(blob, "audio", blob.type.includes("mp4") ? "m4a" : blob.type.includes("ogg") ? "ogg" : "webm"); };
    rec.start(); $("mic").classList.add("rec"); $("mic").textContent = "⏹";
  } catch (e) { alert("Mikrofon nejde: " + e.message); }
};
</script>
</body>
</html>
